# =====================================================================
#   PRINT ROUTINE: START, END, PAUSE & CORRECTIONS
# =====================================================================

[gcode_macro START_PRINT]
description: Starts the print job including preparation and mesh
variable_state: 'Prepare'
variable_record_extruder_temp: 0
variable_max_record_extruder_temp: 0
gcode:
    {% set mesh_name = "default" %}
    {% set mesh_calibrate_temp = printer['gcode_macro _global_var'].bed_mesh_calibrate_target_temp|int %}
    {% set extruder_target_temp = printer.extruder.target|int %}
    {% set bed_targer_temp = printer.heater_bed.target|int %}

    M400
    CLEAR_PAUSE
    G90
    
    {% if state == 'Prepare' %}
        M117 Preparing print...
        {action_respond_info("Prepare!")}

        {% if printer.toolhead.homed_axes|lower != "xyz" %}
            G28
        {% endif %}

        {% if printer['filament_switch_sensor filament_sensor'].enable == True and
              printer['filament_switch_sensor filament_sensor'].filament_detected != True
        %}
            M117 No filament detected!
            {action_respond_info("Please Insert filament in Sensor!")}
            CANCEL_PRINT
        {% endif %}

        M117 Checking heating...
        M140 S{bed_targer_temp}
        M104 S{extruder_target_temp}

        {% if printer.heater_bed.temperature < bed_targer_temp %}
            M117 Bed heating...
            M190 S{bed_targer_temp}
        {% endif %}

        {% if printer.extruder.temperature < extruder_target_temp %}
            M117 Nozzle heating...
            M109 S{extruder_target_temp} 
        {% endif %}

        {% if printer.quad_gantry_level.applied|lower != 'true' %}
            QUAD_GANTRY_LEVEL
        {% endif %}
        
        M117 Calibrating Bed Mesh...
        BED_MESH_CALIBRATE ADAPTIVE=1 
        
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Start"' 
        UPDATE_DELAYED_GCODE ID=_print_start_wait DURATION=0.5

    {% elif state == 'Start' %}
        M117 Printing now...
        {action_respond_info("Start!")}
    {% endif %}

[gcode_macro END_PRINT]
description: Finishes print, moves toolhead away and turns off
variable_state: 'normal'
gcode:
    {% set z_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance|int %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}

    M400
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=record_extruder_temp VALUE=0  
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=max_record_extruder_temp VALUE=0

    M117 Print Finished!
    G91
    {% if printer['filament_switch_sensor filament_sensor'].enable == True and
          printer['filament_switch_sensor filament_sensor'].filament_detected == True
    %}
        {% if (printer.extruder.target != 0 and printer.extruder.temperature >= printer.extruder.target) or
              printer.extruder.temperature >= e_mintemp
        %}
            G1 E-2 F2700
            G1 E-2 Z0.2 F2400
        {% endif %}
    {% endif %}

    {% if (printer.gcode_move.position.z + 10) < z_max %}
        G1 Z+10 F3000
    {% else %}
        G1 Z+{(z_max - printer.gcode_move.position.z)} F3000
    {% endif %}
    G90
    G1 X0 Y360 F9000

    _ALL_FAN_OFF
    TURN_OFF_HEATERS
    M84 X Y Z E  
    M220 S100
    M221 S100
    CLEAR_PAUSE
    {action_respond_info("Finish Print!")}

[gcode_macro CANCEL_PRINT]
description: Cancels the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set x_park = printer['gcode_macro _global_var'].cancel_park.x|float %}
    {% set y_park = printer['gcode_macro _global_var'].cancel_park.y|float %}
    {% set z_park = printer['gcode_macro _global_var'].cancel_park.z|float %}
    {% set z_lift_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance %}
    {% set e_restract = printer['gcode_macro _global_var'].cancel_park.e|float %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}

    CANCEL_PRINT_BASE

    M117 Canceling Print...
    G91
    {% if printer['filament_switch_sensor filament_sensor'].enabled == True and 
          printer['filament_switch_sensor filament_sensor'].filament_detected == True
    %}
        {% if (printer.extruder.target != 0 and printer.extruder.temperature >= printer.extruder.target) or
              printer.extruder.temperature >= e_mintemp
        %}
            G1 E-{e_restract} F500
        {% endif %}
    {% endif %}

    {% if (printer.gcode_move.position.z + 10) < z_lift_max %}
        G1 Z+10 F3000
    {% else %}
        G1 Z+{(z_lift_max - printer.gcode_move.position.z)} F3000
    {% endif %}
    G90
    G1 X{x_park} Y{y_park} F9000

    TURN_OFF_HEATERS
    _ALL_FAN_OFF
    CLEAR_PAUSE
    M84 X Y Z E
    M117 Ready
    {action_respond_info("Cancel Print Success!")}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'

[gcode_macro PAUSE]
description: Pauses the print
rename_existing: PAUSE_BASE
variable_state: 'normal'
gcode:
    {% if printer.pause_resume.is_paused == False %}
        {% set x_park = printer['gcode_macro _global_var'].pause_park.x|float %}
        {% set y_park = printer['gcode_macro _global_var'].pause_park.y|float %}
        {% set e_restract = printer['gcode_macro _global_var'].pause_park.e|float %}
        {% set z_lift_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance %}
        {% set state = params.STATE if 'filament_change' in params.STATE else 'normal' %}
        
        M117 Pausing Print...
        PAUSE_BASE
        G91
        {% if (printer.gcode_move.position.z + 5) < z_lift_max %}
            G1 Z+5 F3000
        {% else %}
            G1 Z+{(z_lift_max - printer.gcode_move.position.z)} F3000
        {% endif %}
        G90
        {% if printer.gcode_move.position.x != x_park and printer.gcode_move.position.y != y_park %}
            G1 X{x_park} Y{y_park} F{printer["gcode_macro _global_var"].pause_resume_travel_speed * 60}
        {% endif %}
        M104 S{printer.extruder.target}
    {% endif %}

[gcode_macro RESUME]
description: Resumes the paused print
rename_existing: RESUME_BASE
variable_state: 'normal'
gcode:
    {% set e_restract = printer['gcode_macro _global_var'].pause_park.e|float %}
    M117 Resuming Print...
    G91
    G1 E{e_restract} F300
    G90
    RESUME_BASE


# =====================================================================
#   FILAMENT HANDLING & MAINTENANCE
# =====================================================================

[gcode_macro LOAD_FILAMENT]
description: Heats nozzle and loads filament
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% if printer.print_stats.state != "printing" %}
        M117 Heating for loading...
        M109 S{extruder_temp}
        M117 Extruding Filament...
        G91 
        G1 E45 F300
        G1 E30 F150
        G90
        M400
        M117 Load Finished
        M104 S0
    {% else %}
        {action_respond_info("Don't load filament during printing!")}
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Heats nozzle and retracts filament
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% if printer.print_stats.state != "printing" %}
        M117 Heating for unloading...
        M109 S{extruder_temp}
        M117 Retracting Filament...
        G91
        G1 E+25 F300
        G1 E-10 F1500
        G1 E-20 F600
        M400
        G4 P3000
        G1 E-50 F300 
        G90
        M400
        M117 Unload Finished
        M104 S0
    {% else %}
        {action_respond_info("Don't unload filament during printing!")}
    {% endif %}

[gcode_macro MAINTENANCE]
description: Moves the printer to maintenance position
gcode:
    M117 Moving to Maintenance
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 Z100 F600
    G1 X175 Y0 F3000

[gcode_macro CLEAN_NOZZLE]
description: Cleans the nozzle on the brush
gcode:
    M117 Cleaning Nozzle...
    {% if printer.toolhead.homed_axes != "xyz" %}
       G28
    {% endif %}
    G90 
    G1 X348 Y0 Z0.3 F9000
    M109 S200
    G91
    G1 Z10 F300
    G90
    M106 S255
    M104 S130
    G1 X315 Y360 F9000
    G1 Z0.2 F300
    # ... (cleaning paths remain unchanged)
    M400
    M117 Clean Finished
    M109 S130
    M107 
    G91
    G1 Z10 F300
    G90
    G28 Z0


# =====================================================================
#   HELPERS, LIGHTING & SYSTEM MACROS
# =====================================================================

[gcode_macro BEEP]
description: Generates a short beep
gcode:
    _LCD_TEMP_MSG MSG="BEEP!" SEC=1.0
    SET_PIN PIN=beeper VALUE=1
    G4 P10  
    SET_PIN PIN=beeper VALUE=0

[gcode_macro mainled_on]
description: Turns main LEDs on (with smooth fade)
gcode:
    _LCD_TEMP_MSG MSG="LED ON" SEC=1.5
    {% for i in range(0, 31) %}
        {% set val = (i / 30.0) ** 2 %}
        SET_PIN PIN=main_led VALUE={val}
        G4 P15
    {% endfor %}

[gcode_macro mainled_off]
description: Turns main LEDs off (with smooth fade)
gcode:
    _LCD_TEMP_MSG MSG="LED OFF" SEC=1.5
    {% for i in range(30, -1, -1) %}
        {% set val = (i / 30.0) ** 2 %}
        SET_PIN PIN=main_led VALUE={val}
        G4 P15
    {% endfor %}

[gcode_macro SHUTDOWN]
description: Safely shuts down the printer/host
gcode:
    {action_call_remote_method("shutdown_machine")}

[gcode_macro _IDLE_TIMEOUT]
gcode:
    {% if printer.print_stats.state == "paused" %}
      RESPOND TYPE=echo MSG="No operations in 10min!"
    {% else %}
      M84
      TURN_OFF_HEATERS
    {% endif %}

[gcode_macro _ALL_FAN_OFF]
gcode:
    M106 S0
    M107

[gcode_macro _global_var]
variable_pause_park:{'x': 0, 'y': 0, 'z': 10, 'e': 1}
variable_cancel_park:{'x': 0, 'y': 350, 'z': 10, 'e': 1}
variable_z_maximum_lifting_distance: 345
variable_pause_resume_travel_speed: 150
variable_bed_mesh_calibrate_target_temp: 65
variable_load_filament_extruder_temp: 250
gcode:


# =====================================================================
#   OVERRIDES & COMPATIBILITY MACROS (M109, M190, M106, etc.)
# =====================================================================

[gcode_macro M109]
rename_existing: M99109
gcode:    
    {% set s = params.S|float %}    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  
    {% if s != 0 %}
        M117 Heating nozzle to {s}C...
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-1} MAXIMUM={s+1}   
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:    
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   
    {% if s != 0 %}
        M117 Heating bed to {s}C...
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-1} MAXIMUM={s+1}  
    {% endif %}

[gcode_macro M106]
gcode:
    {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
    {% if fan == 'fan3'%}
        SET_FAN_SPEED FAN={fan} SPEED={speed}
    {% else %}
        SET_FAN_SPEED FAN={'fan0'} SPEED={speed}
        SET_FAN_SPEED FAN={'fan1'} SPEED={speed}
    {% endif %}

[gcode_macro M107]
gcode:
    {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    {% if fan == 'fan3'%}
        SET_FAN_SPEED FAN={fan} SPEED=0
    {% else %}
        SET_FAN_SPEED FAN={'fan0'} SPEED=0
        SET_FAN_SPEED FAN={'fan1'} SPEED=0
    {% endif %}

[gcode_macro M600]
gcode:
    M117 Filament Change!
    PAUSE STATE=filament_change


# =====================================================================
#   DISPLAY MENUS & DESIGN (BOOT-SCREEN & SV08 LAYOUTS)
# =====================================================================

[menu __main __mainled_on]
type: command
name: LED ON
gcode:
    mainled_on

[menu __main __mainled_off]
type: command
name: LED OFF
gcode:
    mainled_off

[menu __main __maintenance]
type: command
name: Maintenance
gcode:
    MAINTENANCE

[menu __main __shutdown]
type: command
name: Shutdown
gcode:
    mainled_off
    SET_DISPLAY_GROUP GROUP=_blackout
    {menu.exit()}
    SET_LED LED=Screen_Colour RED=0 GREEN=0 BLUE=0
    G4 P1000
    SHUTDOWN

[display_data _bootscreen line1]
position: 0, 0
text: 

[display_data _bootscreen line2]
position: 1, 4
text: ~logo_s~~logo_v~~logo_0~~logo_8~

[display_data _bootscreen line3]
position: 2, 0
text: Mainline Klipper

[display_data _bootscreen line4]
position: 3, 4
text: von Ratti

[display_data _blackout line1]
position: 0, 0
text: 

[display_data _blackout line2]
position: 1, 0
text: 

[display_data _blackout line3]
position: 2, 0
text: 

[display_data _blackout line4]
position: 3, 0
text:

[delayed_gcode _hide_bootscreen]
initial_duration: 5.0
gcode:
    SET_DISPLAY_GROUP GROUP=_sv08_pro

# Modern SV08 Telemetry & Status Layout
[display_data _sv08_pro extruder]
position: 0, 0
text:
  {% set active_extruder = printer.toolhead.extruder %}
  ~extruder~
  {"%3.0f" % (printer[active_extruder].temperature)}
  {% if printer[active_extruder].target %}
    ~right_arrow~{"%0.0f" % (printer[active_extruder].target)}
  {% else %}
    ~degrees~
  {% endif %}

[display_data _sv08_pro z_offset]
position: 0, 10
text:
  Z:{"%+.2f" % (printer.gcode_move.homing_origin.z)}

[display_data _sv08_pro heater_bed]
position: 1, 0
text:
  ~bed~
  {"%3.0f" % (printer.heater_bed.temperature)}
  {% if printer.heater_bed.target %}
    ~right_arrow~{"%0.0f" % (printer.heater_bed.target)}
  {% else %}
    ~degrees~
  {% endif %}

[display_data _sv08_pro speed_factor]
position: 1, 10
text:
  ~feedrate~
  {"%3.0f%%" % (printer.gcode_move.speed_factor * 100)}

[display_data _sv08_pro progress_text]
position: 2, 0
text:
  Prog:{"%3.0f%%" % (printer.display_status.progress * 100)}

[display_data _sv08_pro remaining_time]
position: 2, 10
text:
  {% if printer.display_status.progress > 0 %}
    {% set total_time = printer.print_stats.print_duration / printer.display_status.progress %}
    {% set rem_time = total_time - printer.print_stats.print_duration %}
    -{"%02d:%02d" % (rem_time // 3600, (rem_time // 60) % 60)}
  {% else %}
    --:--
  {% endif %}

[display_data _sv08_pro print_status]
position: 3, 0
text:
  {% if printer.display_status.message %}
    { printer.display_status.message }
  {% elif printer.idle_timeout.state == "Printing" %}
    Printing...
  {% elif printer.extruder.target > 0 or printer.heater_bed.target > 0 %}
    Heating...
  {% else %}
    Ready
  {% endif %}

[delayed_gcode _clear_display_msg]
gcode:
    M117

[gcode_macro _LCD_TEMP_MSG]
gcode:
    {% set msg = params.MSG|default("") %}
    {% set sec = params.SEC|default(3.0)|float %}
    M117 {msg}
    UPDATE_DELAYED_GCODE ID=_clear_display_msg DURATION={sec}

# =====================================================================
#   AUTOMATISCHE FEHLERERKENNUNG (DISPLAY ROT BEI KLIPPER-FEHLER)
# =====================================================================

[delayed_gcode check_printer_error]
initial_duration: 2.0
gcode:

    {% if printer.print_stats.state == "error" or printer.webhooks.state != "ready" %}
        SET_LED LED="Screen_Colour" RED=1 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
    {% endif %}

    UPDATE_DELAYED_GCODE ID=check_printer_error DURATION=2.0

[gcode_macro CANCEL_PRINT]
description: Bricht den laufenden Druck ab
rename_existing: CANCEL_PRINT_BASE
gcode:

    SET_LED LED="Screen_Colour" RED=1 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
    UPDATE_DELAYED_GCODE ID=reset_display_color DURATION=300

    M117 Ready
    {action_respond_info("Cancel Print Success!")}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'

[gcode_macro END_PRINT]
description: Beendet den Druck, fährt den Kopf weg und schaltet ab
variable_state: 'normal'
gcode:

    SET_LED LED="Screen_Colour" RED=0 GREEN=1 BLUE=0 SYNC=0 TRANSMIT=1
    UPDATE_DELAYED_GCODE ID=reset_display_color DURATION=300

    {action_respond_info("Finish Print!")}

[gcode_macro START_PRINT]
description: Startet den Druckvorgang inklusive Vorbereitung und Mesh
variable_state: 'Prepare'
variable_record_extruder_temp: 0
variable_max_record_extruder_temp: 0
gcode:

    SET_LED LED="Screen_Colour" RED=0.12 GREEN=0.2 BLUE=1 SYNC=0 TRANSMIT=1

[delayed_gcode reset_display_color]
gcode:
    SET_LED LED="Screen_Colour" RED=0.12 GREEN=0.2 BLUE=1 SYNC=0 TRANSMIT=1